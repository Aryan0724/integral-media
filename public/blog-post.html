<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Integral Labs</title>
    <link rel="stylesheet" href="style.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
    <!-- BACKGROUND ANIMATION CANVAS -->
    <canvas id="bgCanvas"></canvas>

    <!-- HEADER -->
    <header>
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">INTEGRAL LABS.</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="work.html">Work</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="#" class="cta-btn small" onclick="openForm()">Start Project</a></li>
            </ul>
        </nav>
        <div class="menu-toggle">☰</div>
    </header>

    <!-- PAGE CONTENT -->
    <main style="padding-top: 20vh; min-height: 100vh; padding-bottom: 10vh;">
        <div class="container" style="max-width: 1400px; margin: 0 auto; padding: 0 5%;">

            <!-- Article Container -->
            <div id="post-container" class="post-container">
                <!-- Loading State -->
                <div style="text-align: center; color: #666; padding: 4rem;">
                    Loading article...
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="footer-col">
                <h3>Integral Labs.</h3>
                <p>Websites & Web Apps built to perform.</p>
            </div>
            <div class="footer-col">
                <h4>Socials</h4>
                <ul>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">LinkedIn</a></li>
                    <li><a href="#">Twitter</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Get in Touch</h4>
                <a href="mailto:hello@integral.labs">hello@integral.labs</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Integral Labs. All Rights Reserved.</p>
        </div>

        <!-- Menu Overlay -->
        <div class="menu-overlay">
            <div class="menu-close">CLOSE</div>
            <div class="menu-links">
                <a href="index.html" class="menu-link">HOME</a>
                <a href="work.html" class="menu-link">WORK</a>
                <a href="blog.html" class="menu-link active">BLOG</a>
                <a href="index.html#contact" class="menu-link">CONTACT</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="bg-animation.js"></script>
    <script src="blog-post-loader.js"></script>
    <script>
        // Basic Mobile Menu
        const menuToggle = document.querySelector('.menu-toggle');
        const menuOverlay = document.querySelector('.menu-overlay');
        const menuClose = document.querySelector('.menu-close');

        if (menuToggle && menuOverlay) {
            menuToggle.addEventListener('click', () => {
                menuOverlay.classList.add('active');
            });
        }
        if (menuClose && menuOverlay) {
            menuClose.addEventListener('click', () => {
                menuOverlay.classList.remove('active');
            });
        }

        function openForm() {
            window.location.href = 'index.html#contact';
        }
    </script>
</body>

</html>
